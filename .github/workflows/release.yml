name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Build the app and the installer
        shell: pwsh
        run: |
          # build.ps1 takes the version from appinfo.py, downloads VB-CABLE and checks its hash and signature,
          # then runs PyInstaller and Inno Setup (preinstalled on GitHub's Windows images)
          ./packaging/build.ps1 -Python (Get-Command python).Source

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-COMMS-installer
          path: dist/installer/V-COMMS-Setup-*.exe

      - name: Create Release and Upload Installer
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: V-COMMS ${{ github.ref_name }}
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          files: dist/installer/V-COMMS-Setup-*.exe
          body: |
            # V-COMMS // Real-Time Tactical Voice Engine for Windows

            ### Install (no Python needed)
            1. Download `V-COMMS-Setup-<version>.exe` below and run it.
            2. If your PC doesn't have VB-CABLE yet, Setup installs it (Windows asks for permission once).
            3. Start V-COMMS from the Start Menu. The first-run setup checks your mic and the cable.
            4. In VALORANT: Settings > Audio > Voice Chat > Input Device = **CABLE Output (VB-Audio Virtual Cable)**.

            Upgrading from v1.0.2: your profile and custom presets are copied in the first time the new version starts.
            VB-CABLE is donationware by VB-Audio Software (www.vb-cable.com).
