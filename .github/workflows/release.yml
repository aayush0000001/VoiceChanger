name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (auto, stable, beta)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - stable
          - beta

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Download HuBERT base model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          Write-Host "Downloading HuBERT base model for All-in-One installer bundle..."
          Invoke-WebRequest -Uri "https://huggingface.co/NaruseMioShirakana/MoeSS-SUBModel/resolve/main/vec-768-layer-12.onnx" -OutFile "models/vec-768-layer-12.onnx" -UseBasicParsing
          $expectedHash = "B3886E7DFF1495CDA514F94F4680A7B1261E05D6929F5C764CDB17934B413C2A"
          $actualHash = (Get-FileHash models/vec-768-layer-12.onnx -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "HuBERT model SHA256 mismatch: $actualHash" }

      - name: Build the app and the installer
        shell: pwsh
        run: |
          # build.ps1 takes the version from appinfo.py, downloads VB-CABLE and checks its hash and signature,
          # then runs PyInstaller and Inno Setup (preinstalled on GitHub's Windows images)
          ./packaging/build.ps1 -Python (Get-Command python).Source

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: V-COMMS-installer
          path: dist/installer/V-COMMS-Setup-*.exe

      - name: Determine Release Status (Stable vs Beta)
        id: release_info
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dispatchType = "${{ inputs.release_type }}"
          
          if ($dispatchType -eq "stable") {
            $isStable = $true
          } elseif ($dispatchType -eq "beta") {
            $isStable = $false
          } else {
            # Stable if tag ends in .0, .0.0, or explicitly tagged with -stable
            # Intermediate releases (e.g. 2.1, 2.2, 2.3) default to Beta
            $isStable = ($tag -match '^v?[0-9]+\.0(\.0)?$' -or $tag -match '-stable$')
          }
          
          if ($isStable) {
            Write-Host "Designated as STABLE RELEASE"
            "is_prerelease=false" >> $env:GITHUB_OUTPUT
            "title_suffix=(Stable Release)" >> $env:GITHUB_OUTPUT
            "badge=> [!NOTE]`n> **Stable Release**: Verified production build with confirmed stability.`n" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Designated as BETA / PRE-RELEASE"
            "is_prerelease=true" >> $env:GITHUB_OUTPUT
            "title_suffix=(Beta Release)" >> $env:GITHUB_OUTPUT
            "badge=> [!WARNING]`n> **Beta / Pre-Release**: Incremental build undergoing testing. Use for early evaluation.`n" >> $env:GITHUB_OUTPUT
          }

      - name: Create Release and Upload Installer
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: V-COMMS ${{ github.ref_name }} ${{ steps.release_info.outputs.title_suffix }}
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          tag_name: ${{ github.ref_name }}
          files: dist/installer/V-COMMS-Setup-*.exe
          body: |
            ${{ steps.release_info.outputs.badge }}
            # V-COMMS // Real-Time Tactical Voice Engine for Windows

            ### Install (no Python needed)
            1. Download `V-COMMS-Setup-<version>.exe` below and run it.
            2. If your PC doesn't have VB-CABLE yet, Setup installs it (Windows asks for permission once).
            3. Start V-COMMS from the Start Menu. The first-run setup checks your mic and the cable.
            4. In VALORANT: Settings > Audio > Voice Chat > Input Device = **CABLE Output (VB-Audio Virtual Cable)**.

            Upgrading from v1.0.2: your profile and custom presets are copied in the first time the new version starts.
            VB-CABLE is donationware by VB-Audio Software (www.vb-cable.com).
