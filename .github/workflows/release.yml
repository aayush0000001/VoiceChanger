name: Build and Release Standalone Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "V-COMMS" --icon app_icon.ico --collect-all qfluentwidgets val_voice_changer.py

      - name: Create Release and Upload Executable
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: V-COMMS ${{ github.ref_name }} - Standalone Windows Executable
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name || 'v1.0.1' }}
          files: dist/V-COMMS.exe
          body: |
            # V-COMMS // Real-Time Tactical Voice Engine for Windows 11

            ### Quick Start (No Python Required)
            1. Download `V-COMMS.exe` attached below.
            2. Install [VB-CABLE Virtual Audio Device](https://vb-audio.com/Cable/) (Free) if not already installed.
            3. Set both your Microphone and VB-CABLE to **48,000 Hz (24-bit)** in Windows Sound Control Panel (`mmsys.cpl`).
            4. Double-click `V-COMMS.exe` to run!
